{% extends 'base.html' %}{% block title %}OTP Verification{% endblock %}{% block content %}<div class="auth-wrap"><div class="card auth-card shadow-sm"><div class="card-body p-4"><h2>OTP Verification</h2><p class="text-secondary">Enter the one-time password generated for this login.</p><div class="alert alert-info"><strong>Academic prototype:</strong> email/SMS delivery is simulated on screen.</div>{% if demo_otp %}<div class="otp-demo">Demo OTP: <strong>{{ demo_otp }}</strong></div>{% endif %}<form method="post" class="mt-3"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><input class="form-control form-control-lg text-center letter-spacing" name="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit OTP" required><button class="btn btn-primary w-100 mt-3">Verify OTP</button></form></div></div></div>{% endblock %}
