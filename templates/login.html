{% extends 'base.html' %}{% block title %}Login{% endblock %}{% block content %}<div class="auth-wrap"><div class="card auth-card shadow-sm"><div class="card-body p-4"><h2>Secure Login</h2><p class="text-secondary">Enter your credentials to begin MFA.</p><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required maxlength="50"></div><div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div><button class="btn btn-primary w-100">Continue</button></form><p class="mt-3 mb-0">No account? <a href="{{ url_for('auth.register') }}">Register</a></p></div></div></div>{% endblock %}
