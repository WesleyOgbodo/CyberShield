{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<div class="auth-wrap"><div class="card auth-card shadow-sm"><div class="card-body p-4"><h2>Create Account</h2><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required minlength="3" maxlength="50" value="{{ form_data.username if form_data else '' }}"></div><div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required maxlength="120" value="{{ form_data.email if form_data else '' }}"></div><div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required minlength="8"></div><div class="mb-3"><label class="form-label">Confirm Password</label><input type="password" name="confirm_password" class="form-control" required></div><button class="btn btn-primary w-100">Register</button></form></div></div></div>{% endblock %}
